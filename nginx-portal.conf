# Nginx configuration for Operations Portal CMS
# This file should be placed in /etc/nginx/sites-available/ and symlinked to sites-enabled/
# SSL certs are managed via acme-tiny; cert/key live in app_home/www/challenge/

upstream portal {
    server unix:/soft/django-cms-01/run/portal.socket fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cms2.operations.access-ci.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cms2.operations.access-ci.org;

    ssl_certificate     /soft/django-cms-01/www/challenge/cms2.operations.access-ci.org.signed_chain.crt;
    ssl_certificate_key /soft/django-cms-01/www/challenge/cms2.operations.access-ci.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    access_log /var/log/nginx/portal-access.log;
    error_log /var/log/nginx/portal-error.log;

    location /static/ {
        alias /soft/django-cms-01/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /soft/django-cms-01/PROD/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
