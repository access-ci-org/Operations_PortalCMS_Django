# Nginx configuration for Operations Portal CMS
# This file should be placed in /etc/nginx/sites-available/ and symlinked to sites-enabled/

upstream portalcms {
    server unix:/soft/django-cms-01/run/portalcms.socket fail_timeout=0;
}

server {
    listen 80;
    server_name cms2.operations.access-ci.org;  # CHANGE THIS
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cms2.operations.access-ci.org;  # CHANGE THIS
    
    # SSL Configuration (Let's Encrypt paths - adjust if needed)
    ssl_certificate /etc/letsencrypt/live/cms2.operations.access-ci.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms2.operations.access-ci.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Client upload size limit
    client_max_body_size 100M;
    
    # Logging
    access_log /var/log/nginx/portalcms-access.log;
    error_log /var/log/nginx/portalcms-error.log;
    
    # Static files
    location /static/ {
        alias /soft/django-cms-01/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        alias /soft/django-cms-01/PROD/Operations_PortalCMS_Django/media/;
        expires 7d;
    }
    
    # Main application
    location / {
        proxy_pass http://portalcms;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
