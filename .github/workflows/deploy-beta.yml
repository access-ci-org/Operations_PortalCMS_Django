name: Promote Release through Beta to Production

on:
  # A release tag is the only entry point to the beta-to-production promotion.
  # The tag must resolve to a commit reachable from main.
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Keep the full release train serialized while production awaits approval. This
# prevents a newer tag from replacing the beta version under manual review.
concurrency:
  group: portalcms-release-promotion
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate Deployment Ref
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      app_ref: ${{ steps.validate.outputs.app_ref }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}

    steps:
      - name: Checkout selected application ref
        uses: actions/checkout@v4
        with:
          repository: access-ci-org/Operations_PortalCMS_Django
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected ref
        id: validate
        env:
          APP_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          COMMIT_SHA=$(git rev-parse 'HEAD^{commit}')

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Release promotion must be started by a tag."
            exit 1
          fi

          if [[ ! "$APP_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$APP_REF' must use the vX.Y.Z release format."
            exit 1
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "Tag '$APP_REF' is not reachable from the main branch."
            echo "Only release tags created from main may enter the beta-to-production path."
            exit 1
          fi

          echo "Validated $REF_TYPE '$APP_REF' at $COMMIT_SHA"
          {
            echo "app_ref=$APP_REF"
            echo "commit_sha=$COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Record deployment candidate
        env:
          APP_REF: ${{ steps.validate.outputs.app_ref }}
          COMMIT_SHA: ${{ steps.validate.outputs.commit_sha }}
        run: |
          {
            echo "## Beta deployment candidate"
            echo
            echo "- **Tag:** $APP_REF"
            echo "- **Commit:** $COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  pre-deployment-checks:
    name: Beta Pre-Deployment Checks
    needs: validate-ref
    runs-on: [self-hosted, linux, deployment, portalcms]
    timeout-minutes: 15

    steps:
      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: access-ci-org/Operations_CMS_Infrastructure
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN_PORTAL }}
          persist-credentials: false

      - name: Check beta server health
        run: |
          ssh cms2.operations.access-ci.org "echo 'Beta server is accessible'"

      - name: Check current deployment
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          CURRENT_VERSION=$(ssh cms2.operations.access-ci.org \
            "readlink -f /soft/django-cms-01/PROD | xargs basename" || echo "unknown")

          {
            echo "**Current beta version:** $CURRENT_VERSION"
            echo "**Requested ref:** $APP_REF"
            echo "**Requested commit:** $COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Ansible connectivity
        working-directory: infrastructure/ansible
        run: |
          ansible -i hosts cms2.operations.access-ci.org -m ping

  deploy-beta:
    name: Deploy to Beta
    needs: [validate-ref, pre-deployment-checks]
    runs-on: [self-hosted, linux, deployment, portalcms]
    timeout-minutes: 60
    environment:
      name: beta
      url: https://beta-operations.access-ci.org

    steps:
      - name: Deployment initiated
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          echo "Starting beta deployment"
          echo "Ref: $APP_REF"
          echo "Commit: $COMMIT_SHA"
          echo "Initiated by: $GITHUB_ACTOR"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: Checkout Django Application at validated commit
        uses: actions/checkout@v4
        with:
          repository: access-ci-org/Operations_PortalCMS_Django
          ref: ${{ needs.validate-ref.outputs.commit_sha }}
          path: django-app
          persist-credentials: false

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: access-ci-org/Operations_CMS_Infrastructure
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN_PORTAL }}
          persist-credentials: false

      - name: Create backup
        env:
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:12}
          BACKUP_DIR="/soft/backups/$(date +%Y%m%d-%H%M%S)-pre-$SHORT_SHA"

          # BACKUP_DIR contains only a timestamp and validated commit SHA, so
          # expanding it on the client before running the remote command is intended.
          # shellcheck disable=SC2029
          ssh cms2.operations.access-ci.org \
            "sudo mkdir -p /soft/backups && \
             sudo cp -r /soft/django-cms-01/PROD '$BACKUP_DIR'"

      - name: Run Ansible deployment
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          echo "Deploying $APP_REF at $COMMIT_SHA to beta"

          ansible-playbook \
            -i hosts application_playbook.yml \
            --vault-password-file=<(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            --limit=cms2.operations.access-ci.org \
            --extra-vars "app_tag=$APP_REF git_version=$COMMIT_SHA" \
            -vv

      - name: Check and apply database migrations when needed
        run: |
          set -euo pipefail

          ssh cms2.operations.access-ci.org \
            "cd /soft/django-cms-01 && \
             sudo -u software ./sbin/manage.prod.sh migrate --plan"

          if ssh cms2.operations.access-ci.org \
            "cd /soft/django-cms-01 && \
             sudo -u software ./sbin/manage.prod.sh migrate --check"; then
            echo "Beta database already matches the release migration files; skipping migrate."
          else
            echo "Pending beta migrations detected; applying them now."
            ssh cms2.operations.access-ci.org \
              "cd /soft/django-cms-01 && \
               sudo -u software ./sbin/manage.prod.sh migrate --noinput"
          fi

          ssh cms2.operations.access-ci.org \
            "cd /soft/django-cms-01 && \
             sudo -u software ./sbin/manage.prod.sh migrate --check"

      - name: Collect static files
        run: |
          ssh cms2.operations.access-ci.org \
            "cd /soft/django-cms-01 && sudo -u software ./sbin/manage.prod.sh collectstatic --noinput"

      - name: Restart application service
        run: |
          ssh cms2.operations.access-ci.org \
            "sudo systemctl restart portal.service && \
             sleep 5 && \
             sudo systemctl status portal.service"

      - name: Verify deployment
        id: verify
        run: |
          sleep 15

          SERVICE_STATUS=$(ssh cms2.operations.access-ci.org \
            "systemctl is-active portal.service" || echo "failed")
          if [[ "$SERVICE_STATUS" != "active" ]]; then
            echo "Beta portal.service is not active (status: $SERVICE_STATUS)"
            exit 1
          fi

          HEALTHZ_CODE=$(ssh cms2.operations.access-ci.org \
            "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/healthz/ --max-time 30" \
            || echo "000")
          if [[ "$HEALTHZ_CODE" != "200" ]]; then
            echo "Beta loopback /healthz/ check returned HTTP $HEALTHZ_CODE"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://beta-operations.access-ci.org --max-time 30 || echo "000")
          if [[ ! "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
            echo "Unexpected beta response: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: always()
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
          VERIFICATION: ${{ steps.verify.outputs.status }}
        run: |
          {
            echo "## Beta Deployment Summary"
            echo
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| Environment | beta |"
            echo "| Target host | cms2.operations.access-ci.org |"
            echo "| Ref | $APP_REF |"
            echo "| Commit | $COMMIT_SHA |"
            echo "| Deployed by | $GITHUB_ACTOR |"
            echo "| Deployment status | ${{ job.status }} |"
            echo "| Verification | $VERIFICATION |"
          } >> "$GITHUB_STEP_SUMMARY"

  post-deployment-tests:
    name: Beta Post-Deployment Smoke Tests
    needs: [validate-ref, deploy-beta]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test beta endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://beta-operations.access-ci.org --max-time 30 || echo "000")
          if [[ ! "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
            echo "Beta smoke test failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Record successful beta deployment
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          {
            echo "## Beta validation passed"
            echo
            echo "Ref $APP_REF at $COMMIT_SHA passed the post-deployment smoke test."
            echo "Production now awaits approval in the production environment."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Approve and Deploy to Production
    needs: [validate-ref, post-deployment-tests]
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-production.yml
    with:
      version_tag: ${{ needs.validate-ref.outputs.app_ref }}
      commit_sha: ${{ needs.validate-ref.outputs.commit_sha }}
    secrets: inherit

  rollback-on-failure:
    name: Beta Rollback Instructions
    needs: [validate-ref, deploy-beta]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Record rollback instructions
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          {
            echo "## Beta deployment failed"
            echo
            echo "Ref $APP_REF at $COMMIT_SHA did not complete successfully."
            echo "Production is not eligible to run. Review the failed step and beta backup."
            echo "After correcting main, create a new patch release tag; do not move or reuse this tag."
          } >> "$GITHUB_STEP_SUMMARY"
