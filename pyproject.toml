[project]
name = "djangocms"
version = "1.0.0"
description = "Django CMS Application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-cms>=5.0,<5.1",
    "djangocms-admin-style>=3.3",
    "djangocms-blog",              # Blogging plugin
    "djangocms-text-ckeditor",     # Rich text editor
    "djangocms-file",              # File plugin
    "djangocms-picture",           # Picture plugin
    "djangocms-video",             # Video plugin
    "djangocms-bootstrap5",        # Bootstrap integration
    "requests>=2.32.0",
    "djangorestframework>=3.15.0",
    "gunicorn>=23.0,<24",
    "django-bootstrap5>=25.0,<26",
    "django-allauth[socialaccount]>=65.0,<66",
    "psycopg2-binary>=2.9",
    "access-django-user-admin==1.5.3",
]

[dependency-groups]
dev = []